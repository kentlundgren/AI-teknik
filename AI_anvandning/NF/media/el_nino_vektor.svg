<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 2491" width="1400" height="2491" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" role="img" aria-labelledby="tt dd"><title id="tt">El Niño: affisch med förklaring</title><desc id="dd">Affisch om El Niño med en förklaring av fenomenet, två tvärsnitt av Stilla havet (normalt och under El Niño), tre steg, vad det betyder för Sverige, kopplingen till klimatförändringen och läget hösten 2026. Källor: NOAA och SMHI.</desc><defs><linearGradient id="himmel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b3b5c"/><stop offset="1" stop-color="#14869e"/></linearGradient><linearGradient id="hav" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a8fbf"/><stop offset="1" stop-color="#0b3b5c"/></linearGradient><linearGradient id="varm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff7a2f"/></linearGradient><marker id="pil" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b3b5c"/></marker><marker id="pilt" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7ff0e0"/></marker></defs><rect width="1400" height="2491" fill="#fff7e8"/><rect width="1400" height="290" fill="url(#himmel)"/><circle cx="1230" cy="95" r="70" fill="#ffb347" opacity="0.95"/><path d="M0,240 q70,-26 140,0 t140,0 t140,0 t140,0 t140,0 t140,0 t140,0 t140,0 t140,0 t140,0" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.55"/><path d="M0,258 q70,-26 140,0 t140,0 t140,0 t140,0 t140,0 t140,0 t140,0 t140,0 t140,0 t140,0" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.4"/><path d="M0,276 q70,-26 140,0 t140,0 t140,0 t140,0 t140,0 t140,0 t140,0 t140,0 t140,0 t140,0" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.25000000000000006"/><text x="60" y="150" font-size="140" fill="#ffffff" font-weight="700" text-anchor="start">El Niño</text><text x="62" y="206" font-size="36" fill="#ffe9c4" font-weight="700" text-anchor="start">Ett naturligt fenomen i Stilla havet med följder över hela världen</text><rect x="50" y="320" width="1300" height="356" rx="32" fill="#ffffff" stroke="#cfe3ee" stroke-width="4"/><text x="84" y="394" font-size="44" fill="#0b3b5c" font-weight="700" text-anchor="start">Vad är El Niño?</text><text x="84" y="456" font-size="31" fill="#1d2b33" font-weight="400" text-anchor="start">El Niño är ett naturligt klimatfenomen. Med två till sju års mellanrum, i genomsnitt, blir</text><text x="84" y="498" font-size="31" fill="#1d2b33" font-weight="400" text-anchor="start">ytvattnet i centrala och östra Stilla havet ovanligt varmt. Perioderna varar vanligen 9 till</text><text x="84" y="540" font-size="31" fill="#1d2b33" font-weight="400" text-anchor="start">12 månader.</text><text x="84" y="596" font-size="31" fill="#1d2b33" font-weight="400" text-anchor="start">Namnet betyder ”lilla pojken” på spanska. Fiskare i Sydamerika såg varmt vatten vid</text><text x="84" y="638" font-size="31" fill="#1d2b33" font-weight="400" text-anchor="start">kusten runt jul, och El Niño toppar oftast i december.</text><text x="54" y="756" font-size="44" fill="#0b3b5c" font-weight="700" text-anchor="start">Så fungerar det</text><g transform="translate(50 786) scale(1.4111111111111112)"><clipPath id="knormal"><rect width="450" height="290" rx="22"/></clipPath><rect width="450" height="290" rx="22" fill="#dff1fb"/><g clip-path="url(#knormal)"><rect y="100" width="450" height="190" fill="url(#hav)"/><polygon points="0,100 450,100 450,122 320,134 170,156 0,196" fill="url(#varm)"/><rect x="0" y="100" width="450" height="4" fill="#ffffff" opacity="0.5"/><line x1="410" y1="46" x2="250" y2="46" stroke="#0b3b5c" stroke-width="7" stroke-linecap="round" marker-end="url(#pil)"/><line x1="340" y1="68" x2="180" y2="68" stroke="#0b3b5c" stroke-width="7" stroke-linecap="round" marker-end="url(#pil)"/><text x="225" y="28" font-size="21" fill="#0b3b5c" font-weight="700" text-anchor="middle">Passadvindar blåser västerut</text><text x="140" y="132" font-size="20" fill="#5a2a00" font-weight="700" text-anchor="middle">Varmt ytvatten</text><line x1="356" y1="252" x2="356" y2="148" stroke="#7ff0e0" stroke-width="8" stroke-linecap="round" marker-end="url(#pilt)"/><line x1="392" y1="252" x2="392" y2="148" stroke="#7ff0e0" stroke-width="8" stroke-linecap="round" marker-end="url(#pilt)"/><line x1="428" y1="252" x2="428" y2="148" stroke="#7ff0e0" stroke-width="8" stroke-linecap="round" marker-end="url(#pilt)"/><text x="300" y="276" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">Kallt djupvatten stiger</text></g><text x="12" y="95" font-size="15" fill="#0b3b5c" font-weight="700" text-anchor="start">Väst: Asien, Australien</text><text x="438" y="95" font-size="15" fill="#0b3b5c" font-weight="700" text-anchor="end">Öst: Sydamerika</text></g><g transform="translate(715.0 786) scale(1.4111111111111112)"><clipPath id="kelnino"><rect width="450" height="290" rx="22"/></clipPath><rect width="450" height="290" rx="22" fill="#dff1fb"/><g clip-path="url(#kelnino)"><rect y="100" width="450" height="190" fill="url(#hav)"/><polygon points="0,100 450,100 450,168 300,168 150,170 0,172" fill="url(#varm)"/><rect x="0" y="100" width="450" height="4" fill="#ffffff" opacity="0.5"/><line x1="340" y1="46" x2="290" y2="46" stroke="#0b3b5c" stroke-width="7" stroke-linecap="round" opacity="0.7" marker-end="url(#pil)"/><line x1="280" y1="68" x2="230" y2="68" stroke="#0b3b5c" stroke-width="7" stroke-linecap="round" opacity="0.7" marker-end="url(#pil)"/><text x="225" y="28" font-size="21" fill="#0b3b5c" font-weight="700" text-anchor="middle">Svagare vindar</text><text x="225" y="142" font-size="22" fill="#5a2a00" font-weight="700" text-anchor="middle">Varmt ytvatten</text><line x1="410" y1="250" x2="410" y2="214" stroke="#7ff0e0" stroke-width="8" stroke-linecap="round" opacity="0.6" marker-end="url(#pilt)"/><text x="300" y="276" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">Svag uppvällning</text></g><text x="12" y="95" font-size="15" fill="#0b3b5c" font-weight="700" text-anchor="start">Väst: Asien, Australien</text><text x="438" y="95" font-size="15" fill="#0b3b5c" font-weight="700" text-anchor="end">Öst: Sydamerika</text></g><text x="367.5" y="1237.2222222222222" font-size="34" fill="#0b3b5c" font-weight="700" text-anchor="middle">Normalt</text><text x="1032.5" y="1237.2222222222222" font-size="34" fill="#b34a00" font-weight="700" text-anchor="middle">Under El Niño</text><text x="54" y="1293.2222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">Normalt blåser passadvindarna västerut längs ekvatorn och för med sig varmt vatten från Sydamerika</text><text x="54" y="1331.2222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">mot Asien. Kallt djupvatten stiger då upp för att ersätta det. Tvärsnitten är schematiska och inte</text><text x="54" y="1369.2222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">skalenliga.</text><rect x="50.0" y="1421.2222222222222" width="413.3333333333333" height="360" rx="32" fill="#e3f3e8"/><text x="84.0" y="1489.2222222222222" font-size="38" fill="#17623a" font-weight="700" text-anchor="start">1. Passadvindarna</text><text x="84.0" y="1535.2222222222222" font-size="38" fill="#17623a" font-weight="700" text-anchor="start">försvagas</text><text x="84.0" y="1589.2222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">Vindarna längs ekvatorn</text><text x="84.0" y="1627.2222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">blir svagare eller byter</text><text x="84.0" y="1665.2222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">riktning.</text><rect x="493.3333333333333" y="1421.2222222222222" width="413.3333333333333" height="360" rx="32" fill="#e3f3e8"/><text x="527.3333333333333" y="1489.2222222222222" font-size="38" fill="#17623a" font-weight="700" text-anchor="start">2. Varmt vatten rör</text><text x="527.3333333333333" y="1535.2222222222222" font-size="38" fill="#17623a" font-weight="700" text-anchor="start">sig österut</text><text x="527.3333333333333" y="1589.2222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">Det varma vattnet trycks</text><text x="527.3333333333333" y="1627.2222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">tillbaka mot Amerikas</text><text x="527.3333333333333" y="1665.2222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">västkust. Uppvällningen av</text><text x="527.3333333333333" y="1703.2222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">kallt, näringsrikt djupvatten</text><text x="527.3333333333333" y="1741.2222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">försvagas eller upphör.</text><rect x="936.6666666666666" y="1421.2222222222222" width="413.3333333333333" height="360" rx="32" fill="#e3f3e8"/><text x="970.6666666666666" y="1489.2222222222222" font-size="38" fill="#17623a" font-weight="700" text-anchor="start">3. Regnet flyttar</text><text x="970.6666666666666" y="1535.2222222222222" font-size="38" fill="#17623a" font-weight="700" text-anchor="start">med</text><text x="970.6666666666666" y="1589.2222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">Ofta blir det torrare i</text><text x="970.6666666666666" y="1627.2222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">Australien, Indonesien och</text><text x="970.6666666666666" y="1665.2222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">delar av södra Asien, och</text><text x="970.6666666666666" y="1703.2222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">blötare i södra Sydamerika</text><text x="970.6666666666666" y="1741.2222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">och södra USA.</text><rect x="50.0" y="1817.2222222222222" width="413.3333333333333" height="474" rx="32" fill="#fde9d6"/><text x="84.0" y="1885.2222222222222" font-size="38" fill="#8a4a0c" font-weight="700" text-anchor="start">Vad betyder det</text><text x="84.0" y="1931.2222222222222" font-size="38" fill="#8a4a0c" font-weight="700" text-anchor="start">för Sverige?</text><text x="84.0" y="1985.2222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">Kopplingen till vädret i</text><text x="84.0" y="2023.2222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">Sverige är svag. Men</text><text x="84.0" y="2061.222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">extremväder på andra håll</text><text x="84.0" y="2099.222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">kan slå mot jordbruk och</text><text x="84.0" y="2137.222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">livsmedelspriser på</text><text x="84.0" y="2175.222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">världsmarknaden, och då</text><text x="84.0" y="2213.222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">märks det även här.</text><rect x="493.3333333333333" y="1817.2222222222222" width="413.3333333333333" height="474" rx="32" fill="#ffffff" stroke="#cfe3ee" stroke-width="4"/><text x="527.3333333333333" y="1885.2222222222222" font-size="38" fill="#0b3b5c" font-weight="700" text-anchor="start">El Niño och</text><text x="527.3333333333333" y="1931.2222222222222" font-size="38" fill="#0b3b5c" font-weight="700" text-anchor="start">klimatförändringen</text><text x="527.3333333333333" y="1985.2222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">El Niño är naturligt och</text><text x="527.3333333333333" y="2023.2222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">orsakas inte av</text><text x="527.3333333333333" y="2061.222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">klimatförändringen. Under</text><text x="527.3333333333333" y="2099.222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">en El Niño är världens</text><text x="527.3333333333333" y="2137.222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">medeltemperatur högre än</text><text x="527.3333333333333" y="2175.222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">andra år, och effekterna</text><text x="527.3333333333333" y="2213.222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">tenderar att bli starkare i</text><text x="527.3333333333333" y="2251.222222222222" font-size="28" fill="#1d2b33" font-weight="400" text-anchor="start">ett varmare klimat.</text><rect x="936.6666666666666" y="1817.2222222222222" width="413.3333333333333" height="474" rx="32" fill="#0b3b5c"/><text x="970.6666666666666" y="1885.2222222222222" font-size="38" fill="#ffe9c4" font-weight="700" text-anchor="start">Just nu</text><text x="970.6666666666666" y="1939.2222222222222" font-size="28" fill="#ffffff" font-weight="400" text-anchor="start">I september 2026 räknade</text><text x="970.6666666666666" y="1977.2222222222222" font-size="28" fill="#ffffff" font-weight="400" text-anchor="start">WMO med att El Niño</text><text x="970.6666666666666" y="2015.2222222222222" font-size="28" fill="#ffffff" font-weight="400" text-anchor="start">pågår ända fram i februari</text><text x="970.6666666666666" y="2053.222222222222" font-size="28" fill="#ffffff" font-weight="400" text-anchor="start">2027, med nära 100</text><text x="970.6666666666666" y="2091.222222222222" font-size="28" fill="#ffffff" font-weight="400" text-anchor="start">procents sannolikhet, och</text><text x="970.6666666666666" y="2129.222222222222" font-size="28" fill="#ffffff" font-weight="400" text-anchor="start">kulminerar runt årsskiftet.</text><text x="970.6666666666666" y="2167.222222222222" font-size="28" fill="#ffffff" font-weight="400" text-anchor="start">SMHI beskriver den som</text><text x="970.6666666666666" y="2205.222222222222" font-size="28" fill="#ffffff" font-weight="400" text-anchor="start">en mycket kraftig El Niño.</text><line x1="50" y1="2331.222222222222" x2="1350" y2="2331.222222222222" stroke="#cfc3a8" stroke-width="3"/><text x="54" y="2371.222222222222" font-size="22" fill="#4d5a52" font-weight="400" text-anchor="start">Källor: NOAA National Ocean Service (u.å.) What are El Niño and La Niña? NOAA Climate.gov (u.å.) What is the El Niño–Southern</text><text x="54" y="2401.222222222222" font-size="22" fill="#4d5a52" font-weight="400" text-anchor="start">Oscillation (ENSO) in a nutshell? SMHI (2026) WMO: Exceptionellt varmt hav intensifierar El Niño.</text><text x="54" y="2439.222222222222" font-size="22" fill="#8a4a0c" font-weight="700" text-anchor="start">Affischen är ritad av AI som vektorgrafik och är inte en officiell affisch.</text></svg>