<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1980" width="210mm" height="297mm" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" role="img" aria-labelledby="tt dd"><title id="tt">El Niño: affisch med förklaring (A4)</title><desc id="dd">Affisch om El Niño med en förklaring av fenomenet, två tvärsnitt av Stilla havet (normalt och under El Niño), tre steg, vad det betyder för Sverige, kopplingen till klimatförändringen och läget hösten 2026. Källor: NOAA och SMHI.</desc><rect width="1400" height="1980" fill="#ffffff"/><rect x="70" y="70" width="1260" height="190" rx="30" fill="#dff1fb" stroke="#9cc6dc" stroke-width="3"/><circle cx="1240" cy="150" r="42" fill="#ffb347"/><path d="M74,240 q55,-20 110,0 t110,0 t110,0 t110,0 t110,0 t110,0 t110,0 t110,0 t110,0 t110,0 t110,0" fill="none" stroke="#0b3b5c" stroke-width="4" opacity="0.28"/><text x="104" y="182" font-size="112" fill="#0b3b5c" font-weight="700" text-anchor="start">El Niño</text><text x="108" y="224" font-size="33" fill="#b34a00" font-weight="700" text-anchor="start">Ett naturligt fenomen i Stilla havet med följder över hela världen</text><rect x="70" y="286" width="1260" height="252" rx="26" fill="#ffffff" stroke="#cfe3ee" stroke-width="3"/><text x="98" y="351" font-size="42" fill="#0b3b5c" font-weight="700" text-anchor="start">Vad är El Niño?</text><text x="98" y="409" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">El Niño är ett naturligt klimatfenomen. Med två till sju års mellanrum, i genomsnitt, blir ytvattnet i centrala och</text><text x="98" y="441" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">östra Stilla havet ovanligt varmt. Perioderna varar vanligen 9 till 12 månader.</text><text x="98" y="483" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">Namnet betyder ”lilla pojken” på spanska. Fiskare i Sydamerika såg varmt vatten vid kusten runt jul, och El Niño</text><text x="98" y="515" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">toppar oftast i december.</text><text x="74" y="594" font-size="38" fill="#0b3b5c" font-weight="700" text-anchor="start">Så fungerar det</text><g transform="translate(70 608) scale(1.3711)"><clipPath id="knormal"><rect width="450" height="240" rx="20"/></clipPath><rect width="450" height="240" rx="20" fill="#eef8fd"/><g clip-path="url(#knormal)"><rect y="92" width="450" height="148" fill="#9ccfe9"/><polygon points="0,92 450,92 450,110 320,120 170,140 0,172" fill="#ffc785"/><rect x="0" y="92" width="450" height="3" fill="#ffffff" opacity="0.7"/><g opacity="1.0"><line x1="410" y1="44" x2="276.0" y2="44.0" stroke="#0b3b5c" stroke-width="7" stroke-linecap="round"/><polygon points="250,44 276.0,30.0 276.0,58.0" fill="#0b3b5c"/></g><g opacity="1.0"><line x1="340" y1="66" x2="206.0" y2="66.0" stroke="#0b3b5c" stroke-width="7" stroke-linecap="round"/><polygon points="180,66 206.0,52.0 206.0,80.0" fill="#0b3b5c"/></g><text x="225" y="24" font-size="20" fill="#0b3b5c" font-weight="700" text-anchor="middle">Passadvindar blåser västerut</text><text x="140" y="126" font-size="19" fill="#5a2a00" font-weight="700" text-anchor="middle">Varmt ytvatten</text><g opacity="1.0"><line x1="356" y1="206" x2="356.0" y2="172.0" stroke="#0e8f84" stroke-width="8" stroke-linecap="round"/><polygon points="356,146 370.0,172.0 342.0,172.0" fill="#0e8f84"/></g><g opacity="1.0"><line x1="392" y1="206" x2="392.0" y2="172.0" stroke="#0e8f84" stroke-width="8" stroke-linecap="round"/><polygon points="392,146 406.0,172.0 378.0,172.0" fill="#0e8f84"/></g><g opacity="1.0"><line x1="428" y1="206" x2="428.0" y2="172.0" stroke="#0e8f84" stroke-width="8" stroke-linecap="round"/><polygon points="428,146 442.0,172.0 414.0,172.0" fill="#0e8f84"/></g><text x="270" y="230" font-size="17" fill="#0b3b5c" font-weight="700" text-anchor="middle">Kallt djupvatten stiger</text></g><rect width="450" height="240" rx="20" fill="none" stroke="#9cc6dc" stroke-width="2"/><text x="12" y="88" font-size="15" fill="#0b3b5c" font-weight="700" text-anchor="start">Väst: Asien, Australien</text><text x="438" y="88" font-size="15" fill="#0b3b5c" font-weight="700" text-anchor="end">Öst: Sydamerika</text></g><g transform="translate(713.0 608) scale(1.3711)"><clipPath id="kelnino"><rect width="450" height="240" rx="20"/></clipPath><rect width="450" height="240" rx="20" fill="#eef8fd"/><g clip-path="url(#kelnino)"><rect y="92" width="450" height="148" fill="#9ccfe9"/><polygon points="0,92 450,92 450,150 300,150 150,152 0,154" fill="#ffc785"/><rect x="0" y="92" width="450" height="3" fill="#ffffff" opacity="0.7"/><g opacity="0.7"><line x1="340" y1="44" x2="316.0" y2="44.0" stroke="#0b3b5c" stroke-width="7" stroke-linecap="round"/><polygon points="290,44 316.0,30.0 316.0,58.0" fill="#0b3b5c"/></g><g opacity="0.7"><line x1="280" y1="66" x2="256.0" y2="66.0" stroke="#0b3b5c" stroke-width="7" stroke-linecap="round"/><polygon points="230,66 256.0,52.0 256.0,80.0" fill="#0b3b5c"/></g><text x="225" y="24" font-size="20" fill="#0b3b5c" font-weight="700" text-anchor="middle">Svagare vindar</text><text x="225" y="128" font-size="21" fill="#5a2a00" font-weight="700" text-anchor="middle">Varmt ytvatten</text><g opacity="0.65"><line x1="410" y1="206" x2="410.0" y2="198.0" stroke="#0e8f84" stroke-width="8" stroke-linecap="round"/><polygon points="410,178 421.0,198.0 399.0,198.0" fill="#0e8f84"/></g><text x="270" y="230" font-size="17" fill="#0b3b5c" font-weight="700" text-anchor="middle">Svag uppvällning</text></g><rect width="450" height="240" rx="20" fill="none" stroke="#9cc6dc" stroke-width="2"/><text x="12" y="88" font-size="15" fill="#0b3b5c" font-weight="700" text-anchor="start">Väst: Asien, Australien</text><text x="438" y="88" font-size="15" fill="#0b3b5c" font-weight="700" text-anchor="end">Öst: Sydamerika</text></g><text x="378.5" y="973.1" font-size="30" fill="#0b3b5c" font-weight="700" text-anchor="middle">Normalt</text><text x="1021.5" y="973.1" font-size="30" fill="#b34a00" font-weight="700" text-anchor="middle">Under El Niño</text><text x="74" y="1007.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">Normalt blåser passadvindarna västerut längs ekvatorn och för varmt vatten från Sydamerika mot Asien, och kallt</text><text x="74" y="1039.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">djupvatten stiger upp i stället. Tvärsnitten är schematiska och inte skalenliga.</text><rect x="70.0" y="1073.0666666666666" width="402.7" height="306" rx="26" fill="#e8f5ec" stroke="#bfe0c9" stroke-width="3"/><text x="98.0" y="1131.1" font-size="34" fill="#17623a" font-weight="700" text-anchor="start">1. Passadvindarna</text><text x="98.0" y="1172.1" font-size="34" fill="#17623a" font-weight="700" text-anchor="start">försvagas</text><text x="98.0" y="1221.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">Vindarna längs ekvatorn blir</text><text x="98.0" y="1253.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">svagare eller byter riktning.</text><rect x="498.7" y="1073.0666666666666" width="402.7" height="306" rx="26" fill="#e8f5ec" stroke="#bfe0c9" stroke-width="3"/><text x="526.7" y="1131.1" font-size="34" fill="#17623a" font-weight="700" text-anchor="start">2. Varmt vatten rör</text><text x="526.7" y="1172.1" font-size="34" fill="#17623a" font-weight="700" text-anchor="start">sig österut</text><text x="526.7" y="1221.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">Det varma vattnet trycks tillbaka</text><text x="526.7" y="1253.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">mot Amerikas västkust.</text><text x="526.7" y="1285.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">Uppvällningen av kallt,</text><text x="526.7" y="1317.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">näringsrikt djupvatten försvagas</text><text x="526.7" y="1349.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">eller upphör.</text><rect x="927.3" y="1073.0666666666666" width="402.7" height="306" rx="26" fill="#e8f5ec" stroke="#bfe0c9" stroke-width="3"/><text x="955.3" y="1131.1" font-size="34" fill="#17623a" font-weight="700" text-anchor="start">3. Regnet flyttar med</text><text x="955.3" y="1180.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">Ofta blir det torrare i Australien,</text><text x="955.3" y="1212.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">Indonesien och delar av södra</text><text x="955.3" y="1244.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">Asien, och blötare i södra</text><text x="955.3" y="1276.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">Sydamerika och södra USA.</text><rect x="70.0" y="1405.0666666666666" width="402.7" height="338" rx="26" fill="#fff1e3" stroke="#f0cfaa" stroke-width="3"/><text x="98.0" y="1463.1" font-size="34" fill="#8a4a0c" font-weight="700" text-anchor="start">Vad betyder det för</text><text x="98.0" y="1504.1" font-size="34" fill="#8a4a0c" font-weight="700" text-anchor="start">Sverige?</text><text x="98.0" y="1553.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">Kopplingen till vädret i Sverige är</text><text x="98.0" y="1585.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">svag. Men extremväder på</text><text x="98.0" y="1617.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">andra håll kan slå mot jordbruk</text><text x="98.0" y="1649.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">och livsmedelspriser på</text><text x="98.0" y="1681.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">världsmarknaden.</text><rect x="498.7" y="1405.0666666666666" width="402.7" height="338" rx="26" fill="#ffffff" stroke="#cfe3ee" stroke-width="3"/><text x="526.7" y="1463.1" font-size="34" fill="#0b3b5c" font-weight="700" text-anchor="start">El Niño och</text><text x="526.7" y="1504.1" font-size="34" fill="#0b3b5c" font-weight="700" text-anchor="start">klimatförändringen</text><text x="526.7" y="1553.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">El Niño är naturligt och orsakas</text><text x="526.7" y="1585.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">inte av klimatförändringen.</text><text x="526.7" y="1617.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">Under en El Niño är världens</text><text x="526.7" y="1649.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">medeltemperatur högre än andra</text><text x="526.7" y="1681.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">år, och effekterna tenderar att bli</text><text x="526.7" y="1713.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">starkare i ett varmare klimat.</text><rect x="927.3" y="1405.0666666666666" width="402.7" height="338" rx="26" fill="#eef5fb" stroke="#9cc6dc" stroke-width="3"/><text x="955.3" y="1463.1" font-size="34" fill="#b34a00" font-weight="700" text-anchor="start">Just nu</text><text x="955.3" y="1512.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">I september 2026 räknade WMO</text><text x="955.3" y="1544.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">med att El Niño pågår ända fram</text><text x="955.3" y="1576.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">i februari 2027, med nära 100</text><text x="955.3" y="1608.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">procents sannolikhet, och</text><text x="955.3" y="1640.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">kulminerar runt årsskiftet. SMHI</text><text x="955.3" y="1672.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">beskriver den som en mycket</text><text x="955.3" y="1704.1" font-size="24" fill="#1d2b33" font-weight="400" text-anchor="start">kraftig El Niño.</text><line x1="70" y1="1790" x2="1330" y2="1790" stroke="#cfc3a8" stroke-width="2"/><text x="74" y="1824" font-size="21" fill="#4d5a52" font-weight="400" text-anchor="start">Källor: NOAA National Ocean Service (u.å.) What are El Niño and La Niña? NOAA Climate.gov (u.å.) What is the El Niño–Southern</text><text x="74" y="1852" font-size="21" fill="#4d5a52" font-weight="400" text-anchor="start">Oscillation (ENSO) in a nutshell? SMHI (2026) WMO: Exceptionellt varmt hav intensifierar El Niño.</text><text x="74" y="1884" font-size="21" fill="#8a4a0c" font-weight="700" text-anchor="start">Affischen är ritad av AI som vektorgrafik och är inte en officiell affisch.</text></svg>